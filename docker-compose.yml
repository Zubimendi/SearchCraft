version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: searchcraft
      POSTGRES_PASSWORD: searchcraft
      POSTGRES_DB: searchcraft
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U searchcraft"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.3
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://searchcraft:searchcraft@postgres:5432/searchcraft
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: masterKey
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src:/app/src
      - ./docs:/app/docs

  worker:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      DATABASE_URL: postgresql+asyncpg://searchcraft:searchcraft@postgres:5432/searchcraft
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: masterKey
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    command: python -m src.worker
    volumes:
      - ./src:/app/src
    restart: unless-stopped

volumes:
  postgres_data:
  meili_data:
